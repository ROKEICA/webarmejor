<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" width="800" height="1000" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#064e3b"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047"/>
      <stop offset="50%" stop-color="#eab308"/>
      <stop offset="100%" stop-color="#ca8a04"/>
    </linearGradient>
    <linearGradient id="limeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a3e635"/>
      <stop offset="100%" stop-color="#22c55e"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Fondo -->
  <rect width="800" height="1000" rx="44" fill="url(#bgGrad)"/>
  <rect x="20" y="20" width="760" height="960" rx="36" fill="none" stroke="url(#goldGrad)" stroke-width="6"/>

  <!-- Destellos decorativos -->
  <circle cx="400" cy="360" r="210" fill="#facc15" opacity="0.12" filter="url(#glow)"/>
  <circle cx="400" cy="360" r="155" fill="none" stroke="url(#goldGrad)" stroke-width="6" stroke-dasharray="18 10"/>

  <!-- Trofeo / Medalla Central -->
  <circle cx="400" cy="360" r="130" fill="url(#goldGrad)" filter="url(#glow)"/>
  <circle cx="400" cy="360" r="110" fill="#0f172a"/>
  <text x="400" y="395" font-family="Arial, sans-serif" font-size="115" text-anchor="middle" fill="#fde047">🏆</text>

  <!-- 4 Medallas / Círculos Encendidos -->
  <g transform="translate(0, 560)">
    <circle cx="205" cy="0" r="38" fill="#84cc16" stroke="#ffffff" stroke-width="4" filter="url(#glow)"/>
    <text x="205" y="14" font-family="Arial, sans-serif" font-size="38" text-anchor="middle">🍋</text>

    <circle cx="335" cy="0" r="38" fill="#ef4444" stroke="#ffffff" stroke-width="4" filter="url(#glow)"/>
    <text x="335" y="14" font-family="Arial, sans-serif" font-size="38" text-anchor="middle">🌶️</text>

    <circle cx="465" cy="0" r="38" fill="#facc15" stroke="#ffffff" stroke-width="4" filter="url(#glow)"/>
    <text x="465" y="14" font-family="Arial, sans-serif" font-size="38" text-anchor="middle">🍈</text>

    <circle cx="595" cy="0" r="38" fill="#22c55e" stroke="#ffffff" stroke-width="4" filter="url(#glow)"/>
    <text x="595" y="14" font-family="Arial, sans-serif" font-size="38" text-anchor="middle">🍃</text>
  </g>

  <!-- Textos de Victoria -->
  <text x="400" y="135" font-family="Impact, Arial Black, sans-serif" font-size="54" font-weight="900" fill="url(#goldGrad)" text-anchor="middle" letter-spacing="2">¡ COLECCIÓN COMPLETA !</text>
  <text x="400" y="185" font-family="Arial, sans-serif" font-size="26" font-weight="bold" fill="#e2e8f0" text-anchor="middle">4 DE 4 EMPAQUES PIPAS MEGA ESCANEADOS</text>

  <rect x="110" y="660" width="580" height="150" rx="28" fill="rgba(15,23,42,0.85)" stroke="#a3e635" stroke-width="3"/>
  <text x="400" y="720" font-family="Arial, sans-serif" font-size="34" font-weight="900" fill="#a3e635" text-anchor="middle">¡MEDALLA MAESTRA DESBLOQUEADA!</text>
  <text x="400" y="770" font-family="Arial, sans-serif" font-size="22" fill="#ffffff" text-anchor="middle">Descubriste Mega Acid, Pica Limón, Maraculimón y Mega Verde</text>

  <rect x="200" y="860" width="400" height="64" rx="32" fill="url(#limeGrad)"/>
  <text x="400" y="902" font-family="Arial, sans-serif" font-size="26" font-weight="900" fill="#020617" text-anchor="middle">⭐ PIPAS MEGA FAN OFICIAL ⭐</text>
</svg>
